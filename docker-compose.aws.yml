name: radio-infra-aws

networks:
  radio-net:
    driver: bridge

services:
  radio-registry:
    image: ${CONTAINER_REGISTRY_REPO}/radio-registry:latest
    container_name: radio-registry
    restart: unless-stopped
    environment:
      - SPRING_APP_NAME=radio-registry
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8443
      - SSL_KEYSTORE_PATH=/app/keystore.p12
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD}
      - SPRING_SECURITY_LOG_LEVEL=ERROR
      - HIBERNATE_DEFAULT_SCHEMA=radio_registry
      - HIBERNATE_DDL_AUTO=none
      - HIBERNATE_FORMAT_SQL=false
      - JPA_SHOW_SQL=false
      - DB_URL=${DB_URL}
      - DB_SCHEMA=radio_registry
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EXPOSURE_INCLUDE=health,info,metrics
      - SHOW_DETAILS=when_authorized
      - MANAGEMENT_OTLP_METRICS_ENDPOINT=http://alloy:4318/v1/metrics
      - MANAGEMENT_OTLP_TRACES_ENDPOINT=http://alloy:4318/v1/traces
    volumes:
      - ./certs/keystore.p12:/app/keystore.p12:ro
    ports:
      - "8443:8443"
    networks:
      - radio-net
  radio-analytics:
    image: ${CONTAINER_REGISTRY_REPO}/radio-analytics:latest
    container_name: radio-analytics
    restart: unless-stopped
    environment:
      - SPRING_APP_NAME=radio-analytics
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
      - HIBERNATE_DEFAULT_SCHEMA=radio_analytics
      - HIBERNATE_DDL_AUTO=none
      - HIBERNATE_FORMAT_SQL=false
      - JPA_SHOW_SQL=false
      - DB_URL=${DB_URL}
      - DB_SCHEMA=radio_analytics
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EXPOSURE_INCLUDE=health,info,metrics
      - SHOW_DETAILS=when_authorized
      - MANAGEMENT_OTLP_METRICS_ENDPOINT=http://alloy:4318/v1/metrics
      - MANAGEMENT_OTLP_TRACES_ENDPOINT=http://alloy:4318/v1/traces
    ports:
      - "8081:8081"
    networks:
      - radio-net
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - radio-net
  alloy:
    image: grafana/alloy:v1.18.0
    container_name: alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - radio-net
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - radio-net
  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    restart: unless-stopped
    command: [ "-config.file=/etc/loki/loki.yml" ]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - radio-net
  tempo:
    image: grafana/tempo:3.0.2
    container_name: tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - radio-net
  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/operations.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - radio-net

volumes:
  kafka-data:
    name: radio-kafka-data
  alloy-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data: