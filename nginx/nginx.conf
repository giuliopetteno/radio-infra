load_module /usr/lib/nginx/modules/ngx_http_acme_module.so;

events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;
        contact mailto:giulio.petteno@gmail.com;
        state_path /var/cache/nginx/acme;
        accept_terms_of_service;
    }

    upstream radio_registry {
        zone radio_registry 64k;
        server radio-registry:8443 resolve;
    }

    upstream radio_analytics {
        zone radio_analytics 64k;
        server grafana:3000 resolve;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name radio-registry.giuliopetteno.dev radio-analytics.giuliopetteno.dev;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name radio-registry.giuliopetteno.dev;

        acme_certificate letsencrypt;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;

        location / {
            proxy_pass https://radio_registry;
            proxy_ssl_verify off;
        }
    }

    server {
        listen 443 ssl;
        server_name radio-analytics.giuliopetteno.dev;

        acme_certificate letsencrypt;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;

        location / {
            proxy_pass http://radio_analytics;
        }
    }
}